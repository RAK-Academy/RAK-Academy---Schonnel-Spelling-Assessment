<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RAK Academy | Schonell Spelling Assessment</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #182e3a; background: #f3f6f5; }
    body { margin: 0; padding: 48px 20px; }
    main { max-width: 620px; margin: 0 auto; background: white; padding: clamp(24px, 5vw, 48px); border-radius: 16px; box-shadow: 0 8px 30px #182e3a0a; }
    img { max-width: 180px; height: auto; }
    h1 { font-size: clamp(26px, 5vw, 36px); margin-top: 32px; }
    p { line-height: 1.65; }
    .launch { display: inline-block; padding: 14px 22px; color: white; background: #184f4b; border-radius: 8px; text-decoration: none; margin: 12px 0 28px; font-weight: 600; }
    a:focus-visible { outline: 3px solid #be8e32; outline-offset: 4px; }
    section { border-top: 1px solid #e2e8e6; padding-top: 20px; }
    h2 { font-size: 20px; }
    audio { width: 100%; }
  </style>
</head>
<body>
  <main>
    <img src="images/rak-logo.jpg" alt="RAK Academy">
    <h1>Schonell Spelling Assessment</h1>
    <p>Check that you can hear the recording, then open the assessment and follow your teacher’s instructions.</p>
    <a class="launch" href="https://script.google.com/macros/s/AKfycbyvKeMwT1B9j5EIUXdZvH2wcZFKVup92bfAGNDWx-CaqrbxYdbG0AzofIeGe9oL-xjmYw/exec">Open assessment</a>
    <section aria-labelledby="sound-heading">
      <h2 id="sound-heading">Sound check</h2>
      <p>Press play to check your headphones or speakers.</p>
      <audio controls preload="none" aria-label="Sound check recording" src="audio/sound-check.mp3">Your browser does not support audio playback.</audio>
    </section>
  </main>
</body>
</html>
